<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Kawaii Self — 3D Anime Character (Claude Haiku 5.5)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6fb; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  #ui button {
    border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer;
    background: #ffffffcc; color: #5a3d6e; font-weight: 600; font-size: 13px;
    box-shadow: 0 2px 6px #0002;
  }
  #ui button.on { background: #ff9fcf; color: #fff; }
  body.shot #ui { display: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui">
  <button data-view="front" class="on">Front</button>
  <button data-view="back">Back</button>
  <button data-view="left">Left</button>
  <button data-view="right">Right</button>
  <button data-view="three">3/4</button>
  <button data-view="spin">Spin</button>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
